name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Run Test Suite
        run: npm test

      - name: Build Production Extension
        run: npm run build

      - name: Package Chrome Extension
        if: matrix.node-version == '22.x'
        run: npm run package

      - name: Package Firefox Extension & Source
        if: matrix.node-version == '22.x'
        run: npm run package:firefox

      - name: Upload Chrome Store Package
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-package
          path: nepal-test-filler-v*.zip
          retention-days: 14

      - name: Upload Firefox AMO Package
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: firefox-amo-package
          path: firefox-upload/
          retention-days: 14
